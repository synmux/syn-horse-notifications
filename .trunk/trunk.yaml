# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - eslint
    - prettier
    - oxlint
    - pinact
    - osv-scanner
  enabled:
    - biome@2.6.2
    - svgo@4.1.0
    - grype@0.121.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - trunk-toolbox@0.7.0
    - oxipng@10.2.1
    - actionlint@1.7.12
    - checkov@3.3.30
    - git-diff-check
    - markdownlint@0.49.1
    - taplo@0.10.0
    - trufflehog@3.99.4
    - yamllint@1.38.0
  ignore:
    - linters:
        - ALL
      paths:
        - .agents/**
        - .claude/**
        - .codex/**
        - .serena/**
        - worker-configuration.d.ts
    - linters:
        - yamllint
        - checkov
      paths:
        - .github/workflows/claude*.y*ml
    - linters:
        - trunk-toolbox
      paths:
        - "**/*.gif"
        - "**/*.ico"
        - "**/*.jpg"
        - "**/*.pdf"
        - "**/*.png"
        - "**/*.avif"
        - "**/*.vsix"
        - "**/*.webp"
        - "**/*.zip"
        - "**/*.mov"
        - .trunk/trunk.yaml
        - AGENTS.md
        - README.md
        - TODO.md
actions:
  definitions:
    - id: setup
      display_name: Install dependencies and standardise formatting
      description: Run pnpm install to ensure dependencies are up to date and format the code
      run: pnpm install && pnpm run format
      triggers:
        - git_hooks:
            - pre-commit
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
tools:
  disabled:
    - oxfmt
  enabled:
